<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LOVE CHURRO</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #111;
    font-family: "Noto Sans JP", sans-serif;
    user-select: none;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .main {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 70px;
  }
  .card-section {
    min-height: calc(100vh - 70px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 20px 0 12px;
  }
  @keyframes float {
    0%   { transform: translateY(0px); opacity: 0.5; }
    50%  { transform: translateY(-8px); opacity: 1; }
    100% { transform: translateY(0px); opacity: 0.5; }
  }
  /* ★ peekはcard-wrapper全体を傾ける（カードごとひょこっと動く） */
  @keyframes cardPeek {
    0%   { transform: rotateY(0deg); }
    20%  { transform: rotateY(20deg); }
    40%  { transform: rotateY(0deg); }
    60%  { transform: rotateY(20deg); }
    80%  { transform: rotateY(0deg); }
    100% { transform: rotateY(0deg); }
  }
  .hint {
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    animation: float 2.8s ease-in-out infinite;
    margin-bottom: 6px;
  }
  .sub-hint {
    color: rgba(255,255,255,0.35);
    font-size: 11px;
    letter-spacing: 0.1em;
    margin-bottom: 24px;
  }
  .scene {
    width: 300px;
    height: 480px;
    perspective: 1200px;
    -webkit-perspective: 1200px;
    flex-shrink: 0;
  }
  /* ★ card-wrapper: transform-style: preserve-3dを保持しつつ、CSSアニメーションは一切かけない */
  .card-wrapper {
    width: 100%; height: 100%;
    position: relative;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    cursor: grab;
    transform: rotateY(0deg);
    -webkit-transform: rotateY(0deg);
  }
  .card-wrapper.dragging { cursor: grabbing; }
  .card-face {
    position: absolute; width: 100%; height: 100%;
    border-radius: 20px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    -webkit-transform: translateZ(0);
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }
  /* ★ 表面: rotateY(180deg) → wrapper 0degのとき非表示、180degのとき表示 */
  .card-front {
    background: #fff;
    transform: rotateY(180deg);
    -webkit-transform: rotateY(180deg);
  }
  .card-front .pink-blob {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 44%;
    background: rgb(250,199,202);
    border-radius: 0 0 60% 0 / 0 0 40% 0;
  }
  .card-front .number {
    position: absolute; top: 18px; left: 28px;
    font-family: "Bebas Neue", sans-serif;
    font-size: 80px; color: #fff; line-height: 1;
  }
  .card-front .question-ja,
  .card-front .question-en,
  .card-front .brand {
    opacity: 0;
    transform: translateY(12px);
    -webkit-transform: translateY(12px);
    transition: opacity 0.5s ease, transform 0.5s ease, -webkit-transform 0.5s ease;
  }
  .card-front.revealed .question-ja { opacity:1; transform:translateY(0); -webkit-transform:translateY(0); transition-delay:0.1s; }
  .card-front.revealed .question-en { opacity:1; transform:translateY(0); -webkit-transform:translateY(0); transition-delay:0.25s; }
  .card-front.revealed .brand       { opacity:1; transform:translateY(0); -webkit-transform:translateY(0); transition-delay:0.4s; }
  .card-front .question-ja {
    position: absolute; top: 168px; left: 28px; right: 28px;
    font-size: 22px; font-weight: 700; color: #111; line-height: 1.5;
  }
  .card-front .question-en {
    position: absolute; top: 248px; left: 28px; right: 28px;
    font-size: 13px; color: #555; line-height: 1.7;
  }
  .card-front .brand {
    position: absolute; bottom: 14px; left: 0; right: 0;
    display: flex; justify-content: center; align-items: center;
  }
  .card-front .brand img { width: 180px; object-fit: contain; }
  /* ★ 裏面: rotateY(0deg) → wrapper 0degのとき表示 */
  .card-back {
    background: rgb(250,199,202);
    transform: rotateY(0deg);
    -webkit-transform: rotateY(0deg);
    display: flex; align-items: center; justify-content: center;
  }
  .card-back .back-pattern {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(0,0,0,0.05) 1px, transparent 1px);
    background-size: 20px 20px; border-radius: 20px;
  }
  /* ★ peek用: card-backの内側コンテナ */
  .card-back-inner {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .card-back-inner img { width: 200px; object-fit: contain; position: relative; z-index: 1; }
  /* チャットエリア */
  .chat-area {
    position: fixed;
    left: 0; right: 0;
    display: none;
    flex-direction: column;
    gap: 12px;
    padding: 16px 16px 8px;
    overflow-y: scroll;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    background: #111;
    z-index: 10;
  }
  .chat-area::-webkit-scrollbar { display: none; }
  .chat-area.visible { display: flex; }
  .msg-row {
    display: flex; align-items: flex-end; gap: 8px;
    animation: msgIn 0.3s ease;
  }
  @keyframes msgIn {
    from { opacity:0; transform: translateY(8px); }
    to   { opacity:1; transform: translateY(0); }
  }
  .msg-row.me { flex-direction: row-reverse; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .avatar.me-avatar { background: rgb(250,199,202); }
  .bubble {
    max-width: 200px;
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 13px; line-height: 1.6;
    word-break: break-word;
  }
  .msg-row.me .bubble {
    background: rgb(250,199,202); color: #222;
    border-bottom-right-radius: 4px;
  }
  .msg-row.other .bubble {
    background: rgba(255,255,255,0.1); color: #eee;
    border-bottom-left-radius: 4px;
  }
  .msg-time {
    font-size: 10px; color: rgba(255,255,255,0.25);
    margin-bottom: 2px; flex-shrink: 0;
  }
  /* CTA */
  .cta {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: rgba(17,17,17,0.97);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255,255,255,0.07);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    z-index: 50;
    transform: translateY(100%);
    opacity: 0;
    transition: transform 0.45s cubic-bezier(0.23,1,0.32,1), opacity 0.45s ease;
    pointer-events: none;
  }
  .cta.visible {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .answer-input {
    flex: 1; min-width: 0; max-width: 320px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    padding: 10px 16px;
    color: #fff;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 14px; outline: none; user-select: text;
    -webkit-appearance: none;
    transition: border-color 0.2s;
  }
  .answer-input::placeholder { color: rgba(255,255,255,0.3); }
  .answer-input:focus { border-color: rgb(250,199,202); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: transform 0.15s, opacity 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:active { transform: scale(0.9); opacity: 0.7; }
  .send-btn  { background: rgb(250,199,202); }
  .share-btn { background: rgba(255,255,255,0.1); }
  /* 次の質問ボタン */
  .next-btn-wrap {
    position: absolute;
    top: 10px; right: 10px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transform: scale(0.85) translateY(-4px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
    /* ★ カードより上のz-indexで波紋がカードに隠れない */
    z-index: 100;
    -webkit-tap-highlight-color: transparent;
  }
  .next-btn-wrap.visible {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
  }
  /* 波紋: box-shadow で広がる */
  .next-ripple { display: none; }
  .next-ripple2 { display: none; }
  @keyframes rippleOut {
    0%   { box-shadow: 0 0 0 0 rgba(250,199,202,1); }
    100% { box-shadow: 0 0 0 40px rgba(250,199,202,0); }
  }
  .next-btn-wrap.nudge .next-btn {
    animation: btnPulse 1.4s ease-in-out infinite, rippleOut 1.4s ease-out infinite;
  }
  /* ボタン本体: 波紋に合わせてパルス */
  @keyframes btnPulse {
    0%,100% { transform: scale(1);    border-color: rgba(255,255,255,0.25); }
    50%      { transform: scale(1.08); border-color: rgba(250,199,202,0.9); }
  }
  .next-btn {
    position: relative;
    height: 30px;
    padding: 0 12px;
    border-radius: 20px;
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.25);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.85);
    white-space: nowrap;
    transition: background 0.2s;
    -webkit-tap-highlight-color: transparent;
    z-index: 1;
  }
  .next-btn-wrap.nudge .next-btn {
    background: rgba(250,199,202,0.15);
  }
  .next-btn:active {
    background: rgba(255,255,255,0.22);
    transform: scale(0.94);
  }
  /* タイピングインジケーター */
  .typing-row {
    display: flex; align-items: flex-end; gap: 8px;
    animation: msgIn 0.3s ease;
  }
  .typing-bubble {
    background: rgba(255,255,255,0.1);
    border-radius: 16px; border-bottom-left-radius: 4px;
    padding: 12px 16px;
    display: flex; gap: 5px; align-items: center;
  }
  .typing-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255,255,255,0.5);
    animation: typingDot 1.2s ease-in-out infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingDot {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30%            { transform: translateY(-5px); opacity: 1; }
  }
  .toast {
    position: fixed; bottom: 80px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    color: #fff; padding: 10px 20px; border-radius: 20px;
    font-size: 13px; opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none; white-space: nowrap; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

<script>
  // ===== 定数・変数 =====
  const dummyReplies = [
    "去年は初めてのマラソンを完走したこと！42kmは本当にきつかったけど最高だった😊",
    "それもすごい！転職は勇気いるよね。今の仕事はどう？",
    "最初は不安だったけど、だんだん楽しくなってきたよ！",
    "いいね！やっぱり新しい環境って刺激になるよね。",
    "そうそう！あなたのマラソンはどこで走ったの？",
    "地元の大会だよ。沿道の応援が本当に力になった😭",
    "それめちゃくちゃ感動するやつだ…来年は私も出てみようかな",
    "ぜひ一緒に出よう！トレーニングから付き合うよ💪",
    "ほんとに？！それは心強いな〜！",
    "ふたりで頑張ろう！来年の今頃また振り返ろうね✨",
  ];
  const questions = [
    { num: "1", ja: "この1年で<br>一番頑張ったことは？",     en: "What was the most challenging thing<br>you accomplished in the past year?" },
    { num: "2", ja: "次にやって<br>みたいことは？",           en: "What is something you want<br>to try next?" },
    { num: "3", ja: "今週末<br>どこ行きたい？",               en: "Where do you want to go<br>this weekend?" },
    { num: "4", ja: "今、欲しいものは？",                      en: "What do you want right now?" },
    { num: "5", ja: "相手のどこが好き？",                      en: "What do you like most<br>about the other person?" },
  ];

  let dummyIndex = 0;
  let cardFixed = false;     // 回答後: カードを固定表示
  let isSpinning = false;    // スピン中フラグ
  let isPeeking = false;     // ペークアニメーション中フラグ
  let currentQuestion = 0;
  let questionAnswered = false;
  let questionShown = false;

  // ★ 回転角の真実は currentRotation のみ。常にここから計算する
  let currentRotation = 0;  // 0 = 裏面表示, 180 = 表面表示

  const card = document.getElementById("card");
  const cardFront = document.getElementById("cardFront");
  const cta = document.getElementById("cta");

  // ★ 初期: インラインtransformで明示（Android対応）
  function setCardTransform(val) {
    card.style.transform = val;
    card.style.webkitTransform = val;
  }
  function setCardTransition(val) {
    card.style.transition = val;
    card.style.webkitTransition = val;
  }
  setCardTransition("none");
  setCardTransform("rotateY(0deg)");

  // ===== 質問セット =====
  function setQuestion(idx) {
    const q = questions[idx];
    cardFront.querySelector(".number").textContent = q.num;
    cardFront.querySelector(".question-ja").innerHTML = q.ja;
    cardFront.querySelector(".question-en").innerHTML = q.en;
  }

  // ===== 入力制御 =====
  function setInputDisabled(disabled) {
    const input = document.getElementById("answerInput");
    const send = document.getElementById("sendBtn");
    input.disabled = disabled;
    send.disabled = disabled;
    input.style.opacity = disabled ? "0.4" : "1";
    send.style.opacity = disabled ? "0.4" : "1";
    input.placeholder = disabled ? "カードをめくってね…" : "回答を入力…";
  }
  setInputDisabled(true);

  // ===== ペークアニメーション =====
  // ★ card-wrapper に animation をかける
  // ★ CSSアニメーション中はインライン transform を空にする（競合回避）
  // ★ 終了後にインライン transform を currentRotation で復元
  let peekCount = 0;
  const maxPeek = 5;

  function playPeek() {
    if (isSpinning || isPeeking || cardFixed || peekCount >= maxPeek) return;
    isPeeking = true;
    peekCount++;
    // ★ インラインtransformをクリア → CSSアニメーション(rotateY 0→20→0)が効く
    setCardTransition("none");
    card.style.transform = "";
    card.style.animation = "cardPeek 1.4s ease-in-out";
    card.addEventListener("animationend", onPeekEnd, { once: true });
  }

  function onPeekEnd() {
    card.style.animation = "";
    // ★ currentRotation でインライン transform を復元
    setCardTransform(`rotateY(${currentRotation}deg)`);
    isPeeking = false;
    if (!isSpinning && !cardFixed && peekCount < maxPeek) {
      setTimeout(playPeek, 800);
    }
  }

  setTimeout(playPeek, 800);

  // ===== スピン処理 =====
  // ★ 核心: 必ず表面(180 + 360*n)に着地する
  // currentRotation から dir方向に1回転以上飛ばして、最も近い 180+360n に着地
  function spinToTarget(dir) {
    if (isSpinning || cardFixed) return;
    isSpinning = true;

    // ペーク中なら止める（transformはそのまま維持 → カクつき防止）
    card.style.animation = "";
    isPeeking = false;

    // 質問管理
    if (questionShown) {
      currentQuestion = (currentQuestion + 1) % questions.length;
    }
    questionShown = true;
    questionAnswered = false;
    cardFront.classList.remove("revealed");
    setQuestion(currentQuestion);
    setInputDisabled(true);
    // スピン中はNextボタンを隠す
    nextBtnWrap.classList.remove("visible", "nudge");
    clearTimeout(idleTimer);

    // ★ ターゲット計算
    // dir > 0: 右スワイプ(反時計)、dir < 0: 左スワイプ(時計)
    // 約1回転(360deg)飛ばしてから 180+360n に整列
    const baseAngle = dir > 0
      ? currentRotation + 360
      : currentRotation - 360;
    // 180 + 360n に丸める: (baseAngle - 180) を 360で割って四捨五入し直す
    const n = Math.round((baseAngle - 180) / 360);
    const target = 180 + n * 360;

    // ★ targetが少なくとも現在値から270度以上離れていることを保証
    // (スワイプの方向性を確保)
    let finalTarget = target;
    if (dir > 0 && finalTarget <= currentRotation + 270) {
      finalTarget += 360;
    } else if (dir < 0 && finalTarget >= currentRotation - 270) {
      finalTarget -= 360;
    }

    // スムーズなスピン
    setCardTransition("transform 1.6s cubic-bezier(0.16,1,0.3,1)");
    setCardTransform(`rotateY(${finalTarget}deg)`);
    currentRotation = finalTarget;

    // 900ms後: 表面が見え始めるタイミングでテキストとCTAをフェードイン
    setTimeout(() => {
      cardFront.classList.add("revealed");
      cta.classList.add("visible");
      // 常にNextボタンを表示してナッジ開始（回答前でも・チャット中も）
      setTimeout(showNextBtn, 200);
    }, 900);

    // スピンをFirebaseに送信
    broadcastSpin(currentQuestion);

    // 1600ms後: スピン完了
    setTimeout(() => {
      isSpinning = false;
      setInputDisabled(false);
      // ★ 初回スピン時にルームを作成（回答前でもシェアできる）
      if (db && !roomId) createRoom();
    }, 1600);
  }

  // ===== タッチ操作 =====
  let startX = 0, currentX = 0, isDragging = false;

  card.addEventListener("touchstart", e => {
    if (cardFixed || isSpinning) return;
    startX = e.touches[0].clientX;
    isDragging = true;
    currentX = 0;
    card.classList.add("dragging");
    setCardTransition("none");
    // ★ drag開始時: 必ず currentRotation から描画を開始（CSSとの競合防止）
    setCardTransform(`rotateY(${currentRotation}deg)`);
    cardFront.classList.remove("revealed");
    // ペーク停止
    card.style.animation = "";
    isPeeking = false;
    setInputDisabled(true);
    // スワイプ開始と同時にNextボタンを消す
    nextBtnWrap.classList.remove("visible", "nudge");
    clearTimeout(idleTimer);
  }, { passive: true });

  card.addEventListener("touchmove", e => {
    if (!isDragging) return;
    currentX = e.touches[0].clientX - startX;
    setCardTransform(`rotateY(${currentRotation + currentX * 0.5}deg)`);
  }, { passive: true });

  card.addEventListener("touchend", () => {
    if (!isDragging) return;
    isDragging = false;
    card.classList.remove("dragging");
    if (Math.abs(currentX) > 30) {
      spinToTarget(currentX);
    } else {
      setCardTransition("transform 0.6s cubic-bezier(0.23,1,0.32,1)");
      setCardTransform(`rotateY(${currentRotation}deg)`);
      setInputDisabled(false);
    }
    currentX = 0;
  });

  // ===== マウス操作 =====
  card.addEventListener("mousedown", e => {
    if (cardFixed || isSpinning) return;
    startX = e.clientX;
    isDragging = true;
    currentX = 0;
    card.classList.add("dragging");
    setCardTransition("none");
    setCardTransform(`rotateY(${currentRotation}deg)`);
    cardFront.classList.remove("revealed");
    card.style.animation = "";
    isPeeking = false;
    setInputDisabled(true);
    // スワイプ開始と同時にNextボタンを消す
    nextBtnWrap.classList.remove("visible", "nudge");
    clearTimeout(idleTimer);
    e.preventDefault();
  });
  window.addEventListener("mousemove", e => {
    if (!isDragging) return;
    currentX = e.clientX - startX;
    setCardTransform(`rotateY(${currentRotation + currentX * 0.5}deg)`);
  });
  window.addEventListener("mouseup", () => {
    if (!isDragging) return;
    isDragging = false;
    card.classList.remove("dragging");
    if (Math.abs(currentX) > 30) {
      spinToTarget(currentX);
    } else {
      setCardTransition("transform 0.6s cubic-bezier(0.23,1,0.32,1)");
      setCardTransform(`rotateY(${currentRotation}deg)`);
      setInputDisabled(false);
    }
    currentX = 0;
  });

  // ===== ホイール操作 =====
  let wTimer = null, wDelta = 0;
  card.addEventListener("wheel", e => {
    if (cardFixed || isSpinning) return;
    e.preventDefault();
    wDelta += e.deltaX;
    setCardTransition("none");
    cardFront.classList.remove("revealed");
    setCardTransform(`rotateY(${currentRotation + wDelta * 0.5}deg)`);
    clearTimeout(wTimer);
    wTimer = setTimeout(() => {
      if (Math.abs(wDelta) > 30) {
        spinToTarget(wDelta);
      } else {
        setCardTransition("transform 0.5s cubic-bezier(0.23,1,0.32,1)");
        setCardTransform(`rotateY(${currentRotation}deg)`);
        setInputDisabled(false);
      }
      wDelta = 0;
    }, 200);
  }, { passive: false });

  // ===== チャット =====
  function avatarHTML(isMe) {
    if (isMe) {
      return `<div class="avatar me-avatar"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="15" cy="15" r="15" fill="#F9C5CB"/>
        <ellipse cx="15" cy="13" rx="5.5" ry="6" fill="#F4A7B0"/>
        <circle cx="15" cy="11.5" rx="4" ry="4.5" fill="#FFDDE1"/>
        <ellipse cx="12.5" cy="12" rx="0.8" ry="1" fill="#333"/>
        <ellipse cx="17.5" cy="12" rx="0.8" ry="1" fill="#333"/>
        <path d="M13 14.5 Q15 16 17 14.5" stroke="#E07080" stroke-width="0.8" stroke-linecap="round" fill="none"/>
        <ellipse cx="15" cy="22" rx="7" ry="5" fill="#F4A7B0"/>
        <path d="M11 10 Q12 7 15 7 Q18 7 19 10" fill="#8B4F3A"/>
      </svg></div>`;
    } else {
      return `<div class="avatar"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="15" cy="15" r="15" fill="#A8C8F0"/>
        <ellipse cx="15" cy="13" rx="5.5" ry="6" fill="#7EB3E8"/>
        <circle cx="15" cy="11.5" rx="4" ry="4.5" fill="#D6E8F9"/>
        <ellipse cx="12.5" cy="12" rx="0.8" ry="1" fill="#333"/>
        <ellipse cx="17.5" cy="12" rx="0.8" ry="1" fill="#333"/>
        <path d="M13 14.5 Q15 16 17 14.5" stroke="#5A8AC0" stroke-width="0.8" stroke-linecap="round" fill="none"/>
        <ellipse cx="15" cy="22" rx="7" ry="5" fill="#7EB3E8"/>
        <path d="M11 9.5 Q13 8 15 8.5 Q17 8 19 9.5" fill="#4A3728" stroke="#4A3728" stroke-width="0.5"/>
      </svg></div>`;
    }
  }

  // addMessage → addMessageUI に統合済み

  document.getElementById("sendBtn").addEventListener("click", () => {
    const input = document.getElementById("answerInput");
    const val = input.value.trim();
    if (!val) return;
    input.value = "";
    questionAnswered = true;
    // UI に即表示
    addMessageUI(true, val, Date.now());
    // Firebase に送信（ルームがあれば）
    if (db && messagesRef) {
      sendMessageToFirebase(val);
    }
    // ゲストが未参加ならダミー返信（Firebaseあり・なし両方）
    if (!guestJoined) {
      if (dummyIndex < dummyReplies.length) {
        const reply = dummyReplies[dummyIndex++];
        showTyping();
        setTimeout(() => {
          hideTyping();
          addMessageUI(false, reply, Date.now());
        }, 1600);
      }
    }
  });
  document.getElementById("answerInput").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("sendBtn").click();
  });

  // 入力中ステータスをFirebaseに送信
  let typingTimer = null;
  document.getElementById("answerInput").addEventListener("input", () => {
    if (!db || !roomId) return;
    db.ref("rooms/" + roomId + "/typing/" + myRole).set(true);
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => {
      db.ref("rooms/" + roomId + "/typing/" + myRole).set(false);
    }, 2000);
  });

  document.getElementById("shareBtn").addEventListener("click", async () => {
    if (roomId) {
      // ルームが存在する場合は招待リンクをシェア
      const inviteUrl = location.origin + location.pathname + "?room=" + roomId;
      if (navigator.share) {
        try { await navigator.share({ title:"LOVE CHURRO", text:"一緒に答えてみて！", url: inviteUrl }); } catch(e){}
      } else {
        await navigator.clipboard.writeText(inviteUrl);
        showToast("招待リンクをコピーしました！");
      }
    } else {
      if (navigator.share) {
        try { await navigator.share({ title:"LOVE CHURRO カード", text:"会話が弾むカードゲーム", url: location.href }); } catch(e){}
      } else {
        await navigator.clipboard.writeText(location.href);
        showToast("URLをコピーしました！");
      }
    }
  });

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
  }

  // ===== 次の質問ボタン =====
  const nextBtnWrap = document.getElementById("nextBtnWrap");
  const nextBtn = document.getElementById("nextBtn");
  let idleTimer = null;
  let nudgeTimer = null;

  // カードが固定されたらボタンを表示
  function showNextBtn() {
    nextBtnWrap.classList.add("visible");
    resetIdleTimer();
  }

  // 10秒間誰も入力していなければナッジ演出
  function resetIdleTimer() {
    clearTimeout(idleTimer);
    clearTimeout(nudgeTimer);
    nextBtnWrap.classList.remove("nudge");
    idleTimer = setTimeout(() => {
      nextBtnWrap.classList.remove("nudge");
      // リフローを挟んでアニメーションを再トリガー
      void nextBtnWrap.offsetWidth;
      nextBtnWrap.classList.add("nudge");
    }, 10000);
  }

  // 入力があったらタイマーリセット
  document.getElementById("answerInput").addEventListener("focus", resetIdleTimer);
  document.getElementById("answerInput").addEventListener("input", resetIdleTimer);

  // ボタンを押したら次の質問へ
  nextBtn.addEventListener("click", () => {
    if (isSpinning) return;
    // カード固定を解除してスピン
    cardFixed = false;
    card.style.pointerEvents = "auto";
    nextBtnWrap.classList.remove("visible", "nudge");
    clearTimeout(idleTimer);
    // CTA非表示
    cta.classList.remove("visible");
    setInputDisabled(true);
    // スピン
    spinToTarget(1);
    // スピン後にボタン再表示
    setTimeout(showNextBtn, 1700);
  });

  function updateChatHeight() {
    const chatArea = document.getElementById("chatArea");
    const ctaEl = document.querySelector(".cta");
    const ctaH = ctaEl.offsetHeight || 70;
    chatArea.style.bottom = ctaH + "px";
    chatArea.style.height = "360px";
  }
  window.addEventListener("resize", updateChatHeight);
  window.addEventListener("load", updateChatHeight);

  // ===== Firebase リアルタイム同期 =====
  // Firebase設定
  const firebaseConfig = {
    apiKey: "AIzaSyBgSjx0IZMf7GX2CYT1nDH-XKxuqqeeg6Y",
    authDomain: "lovechurro-card.firebaseapp.com",
    databaseURL: "https://lovechurro-card-default-rtdb.firebaseio.com",
    projectId: "lovechurro-card",
    storageBucket: "lovechurro-card.firebasestorage.app",
    messagingSenderId: "649173943646",
    appId: "1:649173943646:web:ffaff2b557af4a4b4afbcf",
    measurementId: "G-V2267DZ39P"
  };

  // Firebase CDN (compat版 - scriptタグで使える)
  // ※ initAppはCDNロード後に呼ぶ
  let db = null;
  let roomId = null;
  let myRole = null; // "host" or "guest"
  let messagesRef = null;
  let guestJoined = false; // ゲストが参加したかどうか

  function generateRoomId() {
    return Math.random().toString(36).substring(2, 8).toUpperCase();
  }

  function initFirebase() {
    if (typeof firebase === "undefined") return;
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();

    // URLにroomパラメータがあればゲストとして参加
    const params = new URLSearchParams(location.search);
    const roomParam = params.get("room");
    if (roomParam) {
      joinRoom(roomParam);
    }
  }

  // ★ スピンイベントをFirebaseに送信
  function broadcastSpin(questionIdx) {
    if (!db || !roomId) return;
    db.ref("rooms/" + roomId + "/spin").set({
      questionIdx: questionIdx,
      ts: Date.now(),
      by: myRole
    });
  }

  // ★ 相手のスピンを受信してカードを回す
  function watchSpin() {
    if (!db || !roomId) return;
    db.ref("rooms/" + roomId + "/spin").on("value", snap => {
      const data = snap.val();
      if (!data) return;
      if (data.by === myRole) return; // 自分が回したものはスキップ
      // 相手が回した → カードを同期
      if (!isSpinning) {
        // 質問を直接セット（スピンアニメーション付き）
        spinForGuest(data.questionIdx);
      }
    });
  }

  // ゲスト側でスピンアニメーションを再生
  function spinForGuest(questionIdx) {
    if (isSpinning) return;
    isSpinning = true;
    nextBtnWrap.classList.remove("visible", "nudge");
    clearTimeout(idleTimer);

    cardFront.classList.remove("revealed");
    setQuestion(questionIdx);
    setInputDisabled(true);

    // ★ 必ず表面(180+360n)に着地する計算（spinToTargetと同じロジック）
    const baseAngle = currentRotation + 360;
    const n = Math.round((baseAngle - 180) / 360);
    let finalTarget = 180 + n * 360;
    if (finalTarget <= currentRotation + 270) finalTarget += 360;
    setCardTransition("transform 1.6s cubic-bezier(0.16,1,0.3,1)");
    setCardTransform(`rotateY(${finalTarget}deg)`);
    currentRotation = finalTarget;

    setTimeout(() => {
      cardFront.classList.add("revealed");
      cta.classList.add("visible");
      setTimeout(showNextBtn, 200);
    }, 900);

    setTimeout(() => {
      isSpinning = false;
      setInputDisabled(false);
    }, 1600);
  }

  // 相手の入力中ステータスを監視
  function watchTyping() {
    if (!db || !roomId) return;
    const otherRole = myRole === "host" ? "guest" : "host";
    db.ref("rooms/" + roomId + "/typing/" + otherRole).on("value", snap => {
      if (snap.val() === true) {
        showTyping();
        resetIdleTimer(); // 相手が入力中もアイドルタイマーリセット
      } else {
        hideTyping();
      }
    });
  }

  // ★ カードを回したらルームを作成（回答前でもシェアできる）
  function createRoom() {
    if (!db || roomId) return;
    roomId = generateRoomId();
    myRole = "host";
    messagesRef = db.ref("rooms/" + roomId + "/messages");
    listenMessages();
    watchGuestJoin();
    setTimeout(watchTyping, 500);
    setTimeout(watchSpin, 500);
  }

  // ゲストとしてルームに参加
  function joinRoom(id) {
    if (!db) return;
    roomId = id;
    myRole = "guest";
    messagesRef = db.ref("rooms/" + id + "/messages");

    // 既存メッセージを取得して表示
    messagesRef.once("value", snapshot => {
      const data = snapshot.val();
      if (data) {
        Object.values(data).sort((a,b) => a.ts - b.ts).forEach(msg => {
          const isMine = (msg.role === "guest");
          addMessageUI(isMine, msg.text, msg.ts);
        });
      }
      listenMessages();
    });

    db.ref("rooms/" + id + "/status").set({ guestJoined: true });
    guestJoined = true; // ゲスト自身もフラグをtrueに
    setTimeout(watchTyping, 500);
    setTimeout(watchSpin, 500);
    showToast("チャットに参加しました！");
  }

  // メッセージをFirebaseに保存
  function sendMessageToFirebase(text) {
    if (!messagesRef) return;
    const msg = { role: myRole, text: text, ts: Date.now() };
    messagesRef.push(msg);
  }

  // メッセージリスナー（相手のメッセージを受信）
  function listenMessages() {
    if (!messagesRef) return;
    // 接続直後の既存メッセージをスキップするためのフラグ
    let initialized = false;
    setTimeout(() => { initialized = true; }, 2000);

    messagesRef.on("child_added", snapshot => {
      const msg = snapshot.val();
      if (msg.role === myRole) return; // 自分のは表示済みなのでスキップ
      if (!initialized) return; // 既存メッセージはjoinRoom側で表示済み
      // タイピングを一瞬見せてから表示
      showTyping();
      setTimeout(() => {
        hideTyping();
        addMessageUI(false, msg.text, msg.ts);
      }, 800);
    });
  }

  // ゲスト参加通知を監視してトースト表示
  function watchGuestJoin() {
    if (!db || !roomId) return;
    db.ref("rooms/" + roomId + "/status").on("value", snap => {
      if (snap.val()?.guestJoined && !guestJoined) {
        guestJoined = true;
        showToast("友達が参加しました！");
      }
    });
  }

  // ===== タイピングインジケーター =====
  let typingEl = null;

  function showTyping() {
    if (typingEl) return;
    const chatArea = document.getElementById("chatArea");
    chatArea.classList.add("visible");
    typingEl = document.createElement("div");
    typingEl.className = "typing-row";
    typingEl.innerHTML = `${avatarHTML(false)}<div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
    chatArea.appendChild(typingEl);
    setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
  }

  function hideTyping() {
    if (!typingEl) return;
    typingEl.remove();
    typingEl = null;
  }

  // ★ UIにメッセージを追加する共通関数
  function addMessageUI(isMe, text, ts) {
    const chatArea = document.getElementById("chatArea");
    chatArea.classList.add("visible");
    if (!cardFixed) {
      cardFixed = true;
      setCardTransition("none");
      setCardTransform("rotateY(180deg)");
      currentRotation = 180;
      card.style.pointerEvents = "none";
      cardFront.classList.add("revealed");
      const targets = cardFront.querySelectorAll(".question-ja, .question-en, .brand");
      targets.forEach(el => { el.style.transition = "none"; el.style.opacity = "1"; el.style.transform = "translateY(0)"; });
      document.querySelector(".hint").style.display = "none";
      document.querySelector(".sub-hint").style.display = "none";
      document.getElementById("cardSection").style.minHeight = "auto";
      document.getElementById("cardSection").style.paddingTop = "12px";
      cta.classList.add("visible");
      setInputDisabled(false);
      setTimeout(updateChatHeight, 50);
      setTimeout(showNextBtn, 200);
    }
    const time = new Date(ts || Date.now()).toLocaleTimeString("ja-JP", { hour:"2-digit", minute:"2-digit" });
    const row = document.createElement("div");
    row.className = "msg-row " + (isMe ? "me" : "other");
    const bubble = `<div class="bubble">${text}</div>`;
    const timeEl = `<div class="msg-time">${time}</div>`;
    row.innerHTML = isMe ? `${timeEl}${bubble}${avatarHTML(true)}` : `${avatarHTML(false)}${bubble}${timeEl}`;
    chatArea.appendChild(row);
    setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
  }

  // Firebase SDKをCDNからロード
  const fbScript1 = document.createElement("script");
  fbScript1.src = "https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js";
  fbScript1.onload = () => {
    const fbScript2 = document.createElement("script");
    fbScript2.src = "https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js";
    fbScript2.onload = () => { initFirebase(); };
    document.head.appendChild(fbScript2);
  };
  document.head.appendChild(fbScript1);
</script>
</body>
</html>
